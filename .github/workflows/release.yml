name: Plugin release

on:
  push:
    tags:
      - v*

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
      - name: Exit if not on master branch
        run: |
          if [ $(git --no-pager branch --format='%(refname:short)' --contains $(git rev-parse "$TAG_NAME") | grep -E '^master$') ]; then
              echo "Releasing $TAG_NAME"
          else
              echo "Tag $TAG_NAME is not on master branch"
              exit -1
          fi
        env:
          TAG_NAME: ${{ github.ref_name }}
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, test with Gradle
        run: |
          ./gradlew clean build jacocoTestReport \
            :flowable-intellij-plugin:buildPlugin :flowable-intellij-plugin:verifyPlugin \
            :camunda-intellij-plugin:buildPlugin :camunda-intellij-plugin:verifyPlugin \
            :activiti-intellij-plugin:buildPlugin :activiti-intellij-plugin:verifyPlugin
      - name: Release plugin(s)
        run: |
          ./gradlew :flowable-intellij-plugin:publishPlugin \
            :camunda-intellij-plugin:publishPlugin \
            :activiti-intellij-plugin:publishPlugin
        env:
          INTELLIJ_PLUGIN_PUBLISH_TOKEN: ${{ secrets.INTELLIJ_PLUGIN_PUBLISH_TOKEN }}
