import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'org.jetbrains.kotlin.kapt' version '2.4.10'
}

allprojects {
    ext {
        intellijPlatformVersion = '2026.2.1'
        intellijPlatformPlugins = ['com.intellij.java', 'com.intellij.database'] // DatabaseTools is for BPMN process 'debugging'

        kotlinStdlib = '2.4.10'
        kotlinApiVersion = '2.2'

        mapstruct = '1.6.3'
        jackson = '2.22.2'
        jacksonAnnotations = '2.22'
        dom4j = '2.2.0'
        jaxen = '2.0.6'

        junitJupiter = '6.1.3'
        jsonPath = '3.0.0'
        junitPlatformRunner = '1.14.4'
        kluent = '1.73'
        mockitoCore = '5.23.0'
        mockitoKotlin = '6.3.0'
    }
}

group = 'com.valb3r'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

dependencies {
    intellijPlatform {
        intellijIdeaUltimate(intellijPlatformVersion)
        bundledPlugins(intellijPlatformPlugins)
    }
}

allprojects {
    apply plugin: 'jacoco'

    plugins.withId('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
            }
        }
    }

    jacoco {
        toolVersion = '0.8.15'
    }
}



subprojects {
    tasks.withType(Test) {
        useJUnitPlatform()
    }

    tasks.withType(KotlinCompile).configureEach {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
            apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_2
        }
    }
}
